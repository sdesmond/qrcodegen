title = "Logo UI: drop zone, inline errors and EC lock"
description = "Adds the focusable drop zone with client pre-check and inline reason plus limit, keeps the previous logo on rejection, shows the 10-30 size slider only with a logo, and locks error correction to H with its reason shown in both places and the prior level restored on removal; the scan check Fix in story 7 skips its error-correction step while this lock is on."
verify = "A rejected upload shows reason plus limit without blocking the form, and adding then removing a logo locks and then restores the error correction level."
covers = ["CAP-4"]
