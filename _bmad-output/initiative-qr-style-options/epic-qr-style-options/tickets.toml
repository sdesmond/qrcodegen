# tickets.toml for epic-qr-style-options. Order of tables is build order.

[[entry]]
id = 1
type = "story"
title = "Tracer: preset table and shared renderer with Square and Circle end to end"
description = "Adds the shared preset JSON table and one per-module renderer for PNG and SVG, a preset parameter through the POST routes, and a minimal picker in the form, rendering Square and Circle, with zxing-cpp added as a dev dependency and a decode test helper so tests can decode renders."
verify = "Selecting Circle in the UI and pressing Generate shows a circular-dot, circular-eye code that decodes on PNG and SVG; Square matches today's PNG output."
covers = ["CAP-1"]
after = []
hitl = false
risk = "medium"

[[entry]]
id = 13
type = "story"
title = "UI foundation: restructure, tokens and accessibility floor"
description = "Reorders the form into Content, Code Settings, Colors, Logo and Style sections, removes the Output Format radio and Copy URL row, hides QR-only sections on barcode tabs, and adds the new color and focus tokens and the persistent status region. Its CAP-9 part is the removal of the Copy URL row, since the GET shim goes away in story 11."
verify = "The page shows the new section order, barcode tabs show the QR-only hint instead of Colors, Logo and Style, and a keyboard-only pass reaches every control with a visible focus ring."
covers = ["CAP-9"]
after = [1]
hitl = false
risk = "medium"
references = ["ux-qr-style-options/EXPERIENCE.md#information-architecture", "ux-qr-style-options/DESIGN.md#colors"]

[[entry]]
id = 2
type = "story"
title = "Rounded, Horizontal, Vertical and Bubble presets"
description = "Adds four presets as rows in the table with their dot, frame and ball renderers."
verify = "Each of the four presets renders on PNG and SVG and decodes at the default size."
covers = ["CAP-1"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Color, gradient and contrast warning"
description = "Adds solid and gradient color with five directions including radial, applied to PNG and SVG on top of any preset, with the Colors section UI and an inline contrast warning with its own Fix button at a 4:1 threshold; the contrast clamp it adds is the first step of the scan check Fix in story 7."
verify = "Any color setting renders with any preset on PNG and SVG; a pair below 4:1 shows the warning and Fix restores a passing pair."
covers = ["CAP-3"]
after = [1, 13, 2]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Preset thumbnail strip"
description = "Adds the radio-group strip of 72px client-side thumbnails of every preset, drawn from the shared table in the chosen color or gradient, with roving tabindex and a visible scrollbar."
verify = "All presets show at all times, arrow keys select, and the thumbnails redraw when the color or gradient changes, with no request tied to the user's data."
covers = ["CAP-2"]
after = [2, 4]
hitl = false
risk = "low"

[[entry]]
id = 6
type = "story"
title = "Generate and Download state machine"
description = "Makes Generate and Download strict inverses with aria-disabled semantics, removes the old code and shows the empty state on any change, adds the Generating, Generated and error states, and the floating Generate on narrow screens."
verify = "Any input or preset change replaces the code with the empty state, enables Generate and disables Download; a fresh code does the reverse, and the status region announces each change once."
covers = ["CAP-6"]
after = [1, 13, 4, 5]
hitl = false
risk = "medium"
notes = ["Replaces the spec's dimmed old code with the empty state; the spec's CAP-6 wording needs updating."]

[[entry]]
id = 7
type = "story"
title = "Scan check with persistent warning and one-click fix"
description = "Promotes zxing-cpp to a runtime dependency and decodes the server's own PNG and SVG renders at generate time, with the warning banner, a Fix button that changes one control per Generate in the order contrast (reusing story 4), error correction, smaller logo, and a could-not-check state; the error-correction step is skipped when a logo already locks it to H (story 14)."
verify = "A deliberately failing code shows the warning and a Fix button naming its change; applying it then pressing Generate produces a code that decodes and clears the warning; Download stays enabled with the warning glyph meanwhile."
covers = ["CAP-5"]
after = [1, 4, 6]
hitl = true
risk = "high"
unknown = "Whether the Docker image can install the decoder under the dev machine's TLS interception; a person checks the build."
notes = ["zxing-cpp is the assumed decoder; opencv-headless is the fallback."]

[[entry]]
id = 3
type = "story"
title = "Fluid preset"
description = "Adds merged-blob dots with rounded convex corners and smoothed concave fillets, rounded-square eyes and a blob ball."
verify = "A Fluid code has no square edges, decodes on PNG and SVG, and the fillet radius is fixed by the scan test."
covers = ["CAP-1"]
after = [1, 7]
hitl = false
risk = "high"
unknown = "Fillet radius for concave joins is not yet known; tune it against the scan test."

